<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" fill="none" width="100%" height="100%">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <!-- Premium tech gradients representing Aura Pixel -->
    <linearGradient id="auraGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" /> <!-- Indigo -->
      <stop offset="50%" stop-color="#7C3AED" /> <!-- Violet -->
      <stop offset="100%" stop-color="#06B6D4" /> <!-- Cyan -->
    </linearGradient>
    
    <linearGradient id="pixelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" /> <!-- Blue -->
      <stop offset="100%" stop-color="#2DD4BF" /> <!-- Teal -->
    </linearGradient>
    
    <!-- Subtle professional drop shadow for depth -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (Aura Pixel Icon) -->
  <g transform="translate(10, 10)">
    <!-- Back Aura Path: Flowing Abstract "A" & "P" Shape -->
    <path d="M 25,0 L 55,50 L 55,80 L 40,80 L 40,60 L 15,60 L 5,80 L -10,80 Z" fill="url(#auraGradient)" opacity="0.9" filter="url(#softGlow)" />
    
    <!-- Inner Accent Flow -->
    <path d="M 25,18 L 40,45 L 20,45 Z" fill="#FFFFFF" opacity="0.95" />
    
    <!-- "Pixel" Accents: Geometric Blocks overlapping representing engineering precision -->
    <rect x="42" y="55" width="12" height="12" rx="2" fill="url(#pixelGradient)" />
    <rect x="56" y="41" width="12" height="12" rx="2" fill="url(#pixelGradient)" opacity="0.8" />
    <rect x="56" y="55" width="12" height="12" rx="2" fill="url(#pixelGradient)" opacity="0.5" />
  </g>

  <!-- Logo Text (Aura Pixel Brand Name) -->
  <g transform="translate(100, 62)">
    <!-- "Aura" - Editorial, tracking tight, modern semi-bold -->
    <text font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="34" letter-spacing="-1px" fill="#0F172A">Aura</text>
    
    <!-- "Pixel" - High Contrast Premium Gradient -->
    <text x="82" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="34" letter-spacing="-0.5px" fill="url(#auraGradient)">Pixel</text>
    
    <!-- Subtitle - Digital Agency -->
    <text y="20" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="10" letter-spacing="4px" fill="#64748B">DIGITAL LABS</text>
  </g>
</svg>
